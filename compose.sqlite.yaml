name: hw3-sqlite

services:
  app:
    build: .
    image: counter-app:latest
    environment:
      GREETING: ${GREETING:-Hello, Docker!}
      PORT: "8000"
      STORAGE: sqlite
      DATA_FILE: /data/counter.db
    ports:
      - "${APP_PORT:-8080}:8000"
    volumes:
      - counter-data:/data
    restart: unless-stopped

volumes:
  counter-data:
